<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumbs & Love</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <nav>
      <h1>Crumbs & Love</h1>

      <ul>
        <li><a href="#catalogo">Catálogo</a></li>
        <li><a href="#pedido">Pedidos</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="hero">
      <div>
        <h2>Galletas artesanales hechas con amor</h2>

        <p>
          Galletas suaves, frescas y perfectas para cualquier momento.
        </p>

        <button id="explorar-btn">
          Explorar sabores
        </button>
      </div>

      <img src="assets/hero.jpg" alt="Galletas artesanales">
    </section>

    <section id="catalogo">
      <h2>Nuestro catálogo</h2>

      <div id="productos-container"></div>

      <p id="estado-vacio" hidden>
        No hay productos disponibles en este momento.
      </p>
    </section>

    <section id="pedido">
      <h2>Haz tu pedido</h2>

      <form id="pedido-form">

        <div>
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required>
        </div>

        <div>
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required>
        </div>

        <div>
          <label for="telefono">Número de teléfono</label>
          <input type="tel" id="telefono" required>
        </div>

        <div>
          <label for="cantidad">Cantidad de cajas</label>
          <input type="number" id="cantidad" min="1" required>
        </div>

        <button type="submit" id="submit-btn">
          Confirmar pedido de galletas
        </button>

      </form>

      <p id="mensaje"></p>
    </section>

  </main>

  <footer>
    <p>Crumbs & Love © 2026</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
